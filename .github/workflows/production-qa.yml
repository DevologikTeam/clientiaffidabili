name: Production QA Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: node scripts/qa-web-build-static-guards.js
      - run: node scripts/qa-docker-runtime-static-guards.js
      - run: node scripts/qa-api-typeorm-postgres-static-guards.js
      - run: node scripts/qa-coolify-preflight-static-guards.js
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/rc-hardening-production-env-guard.js
      - run: node scripts/rc-hardening-gate-runner.js
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:ci
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
